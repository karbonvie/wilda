# =========================================================
# CORE SYSTEM - Hardware Enablement
# =========================================================
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_NRFX_SAADC=y

# =========================================================
# USB & SERIAL - Required for Maintenance Mode
# =========================================================
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="WildlifeThrive-Service"
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM=y

# =========================================================
# LOW POWER KERNEL - Keeping the floor low
# =========================================================
CONFIG_TICKLESS_KERNEL=y
CONFIG_PM_DEVICE=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=256

# ================= ========================================
# CLOCK CONFIGURATION - Use Internal RC for Power
# =========================================================
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# =========================================================
# STRIP OVERHEAD - No logging, no console in Normal Mode
# =========================================================
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_ASSERT=n
CONFIG_BOOT_BANNER=n