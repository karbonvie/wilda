# --- CORE DRIVERS & KERNEL (Required) ---
CONFIG_GPIO=y
CONFIG_FLASH=y
CONFIG_COUNTER=y
CONFIG_ADC=y
CONFIG_NRFX_SAADC=y

# --- POWER MANAGEMENT & TICKLESS (Required for Low Power) ---
CONFIG_TICKLESS_KERNEL=y
CONFIG_PM_DEVICE=y
CONFIG_ISR_STACK_SIZE=2048

# --- LOW FREQUENCY CLOCK (Required for RTC/Tickless) ---
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

