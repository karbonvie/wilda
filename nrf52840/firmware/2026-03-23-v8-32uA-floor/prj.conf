# --- CORE DRIVERS & KERNEL ---
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_NRFX_SAADC=y
CONFIG_COUNTER=y

# Disable flash subsystem entirely to prevent it from keeping clocks alive 
# or fighting our manual GPIO pin parking.
CONFIG_FLASH=n

# --- POWER MANAGEMENT & TICKLESS (Required for Low Power) ---
CONFIG_TICKLESS_KERNEL=y
CONFIG_PM_DEVICE=y
CONFIG_ISR_STACK_SIZE=2048

# --- LOW FREQUENCY CLOCK (Required for RTC/Tickless) ---
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Disable Serial/UART to kill the ~400uA HFCLK leak
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG=n